# ⚠️  THIS FILE IS NOT THE ACTIVE NETLIFY CONFIG.
#
# The site's base directory is landing/, so Netlify reads landing/netlify.toml
# and never sees this file. Proof: the /invite/* rewrite exists only in the
# landing/ copy and is live in production, while three redirects added here on
# 2026-08-26 had no effect at all until they were moved.
#
# Redirects, rewrites and headers belong in landing/netlify.toml. This file is
# kept only so the publish path is discoverable from the repo root; do not add
# rules here expecting them to apply.

[build]
  publish = "landing/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


[[redirects]]
  from = "/blog/booki-vs-realbookies"
  to = "/vs/realbookies"
  status = 301

[[redirects]]
  from = "/blog/booki-vs-price-per-player"
  to = "/vs/price-per-player"
  status = 301
