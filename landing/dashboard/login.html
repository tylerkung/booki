<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="../assets/favicon_io/favicon.ico">
    <title>Booki Dashboard — Log In</title>
    <meta name="description" content="Log in to your Booki dashboard to manage your book or track your picks.">

    <meta property="og:title" content="Booki Dashboard — Log In">
    <meta property="og:description" content="Manage your book or track your picks from the web.">
    <meta property="og:image" content="https://bookisports.com/assets/booki-og.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="../index.html" class="auth-logo">
                <img src="../assets/logo-booki-blk.svg" alt="Booki" />
            </a>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Log in to your dashboard</p>

            <!-- Login Form -->
            <div id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password">
                </div>
                <div id="login-error" class="form-error" style="display:none;"></div>
                <button id="login-btn" class="btn-primary-full" onclick="handleLogin()">Log In</button>
                <div class="auth-links">
                    <a href="#" onclick="showForgotPassword(); return false;">Forgot Password?</a>
                    <span class="auth-divider">|</span>
                    <a href="#" onclick="showSignUp(); return false;">Create Account</a>
                </div>
            </div>

            <!-- Sign Up Form -->
            <div id="signup-form" style="display:none;">
                <div class="form-group">
                    <label for="signup-name">Name</label>
                    <input type="text" id="signup-name" placeholder="Your name" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Min 6 characters" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="signup-password-confirm">Confirm Password</label>
                    <input type="password" id="signup-password-confirm" placeholder="Re-enter password" autocomplete="new-password">
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="signup-age">
                    <span>I confirm I am 18 years or older</span>
                </label>
                <div id="signup-error" class="form-error" style="display:none;"></div>
                <button id="signup-btn" class="btn-primary-full" onclick="handleSignUp()">Create Account</button>
                <div class="auth-links">
                    <a href="#" onclick="showLogin(); return false;">Back to Log In</a>
                </div>
            </div>

            <!-- Verification Pending -->
            <div id="verification-pending" style="display:none;">
                <div style="text-align:center;padding:var(--s-sm) 0 var(--s-lg);">
                    <div style="width:56px;height:56px;border-radius:var(--radius-circle);background:var(--fill-accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto var(--s-xl);">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent, #00F5D4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </div>
                    <p style="font-size:var(--fs-body);color:var(--text-secondary);line-height:var(--lh-loose);margin:0 0 var(--s-xs);">We sent a verification link to</p>
                    <p id="verification-email" style="font-size:var(--fs-body);font-weight:var(--fw-semibold);color:var(--text-primary);margin:0 0 var(--s-lg);"></p>
                    <p id="verification-status" style="font-size:var(--fs-sm);color:var(--text-secondary);margin:0;">Waiting for verification<span id="verification-dots">...</span></p>
                </div>
                <div class="auth-links" style="margin-top:var(--s-lg);">
                    <a href="#" onclick="showLogin(); stopVerificationPolling(); return false;">Back to Log In</a>
                </div>
            </div>

            <!-- Forgot Password Form -->
            <div id="forgot-form" style="display:none;">
                <div class="form-group">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" placeholder="you@example.com" autocomplete="email">
                </div>
                <div id="forgot-error" class="form-error" style="display:none;"></div>
                <div id="forgot-success" class="form-success" style="display:none;"></div>
                <button id="forgot-btn" class="btn-primary-full" onclick="handleForgotPassword()">Send Reset Link</button>
                <div class="auth-links">
                    <a href="#" onclick="showLogin(); return false;">Back to Log In</a>
                </div>
            </div>

            <p class="auth-disclaimer">Pick tracking platform. Not a sportsbook. No payment processing.</p>
        </div>
    </div>

    <script>
        // ── Supabase Init ──
        const SUPABASE_URL = 'https://vstfauqufwpdytmvjyfz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzdGZhdXF1ZndwZHl0bXZqeWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMjcwNjcsImV4cCI6MjA4NDgwMzA2N30.uwimFkR3pN8BODjjM5KnusptdZz_vcrxKnK_2LKfZHI';
        let sbClient;

        // Initialize — key must be set in localStorage or env
        function initSupabase() {
            if (!SUPABASE_ANON_KEY) {
                document.getElementById('login-error').textContent = 'Dashboard not configured. Contact support.';
                document.getElementById('login-error').style.display = 'block';
                return false;
            }
            sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            return true;
        }

        // Check if already logged in — redirect to app for confirmed users
        async function checkSession() {
            if (!initSupabase()) return;
            const { data: { session } } = await sbClient.auth.getSession();
            if (session) {
                // Only redirect if email is confirmed
                const { data: { user } } = await sbClient.auth.getUser();
                if (user?.confirmed_at || user?.email_confirmed_at) {
                    window.location.href = './';
                }
            }
        }

        checkSession();

        // ── Form Toggles ──
        function showLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('forgot-form').style.display = 'none';
            document.getElementById('verification-pending').style.display = 'none';
            document.querySelector('.auth-title').textContent = 'Welcome back';
            document.querySelector('.auth-subtitle').textContent = 'Log in to your dashboard';
        }

        function showSignUp() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
            document.getElementById('forgot-form').style.display = 'none';
            document.getElementById('verification-pending').style.display = 'none';
            document.querySelector('.auth-title').textContent = 'Create account';
            document.querySelector('.auth-subtitle').textContent = 'Start managing your group';
        }

        function showForgotPassword() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('forgot-form').style.display = 'block';
            document.getElementById('verification-pending').style.display = 'none';
            document.querySelector('.auth-title').textContent = 'Reset password';
            document.querySelector('.auth-subtitle').textContent = 'Enter your email to receive a reset link';
        }

        // ── Login ──
        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            errorEl.style.display = 'none';
            if (!email || !password) {
                errorEl.textContent = 'Please enter email and password';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            const { data, error } = await sbClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Log In';
                return;
            }

            // Redirect to app — role detection happens in app.html
            window.location.href = './';
        }

        // ── Sign Up ──
        async function handleSignUp() {
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const ageConfirmed = document.getElementById('signup-age').checked;
            const errorEl = document.getElementById('signup-error');
            const btn = document.getElementById('signup-btn');

            errorEl.style.display = 'none';

            if (!name || !email || !password) {
                errorEl.textContent = 'All fields are required';
                errorEl.style.display = 'block';
                return;
            }
            const passwordConfirm = document.getElementById('signup-password-confirm').value;
            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters';
                errorEl.style.display = 'block';
                return;
            }
            if (password !== passwordConfirm) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }
            if (!ageConfirmed) {
                errorEl.textContent = 'You must confirm you are 18 or older';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const { data, error } = await sbClient.auth.signUp({
                email,
                password,
                options: { data: { name } }
            });

            if (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Account';
                return;
            }

            if (data.user && !data.user.confirmed_at) {
                // Show verification pending UI
                document.getElementById('signup-form').style.display = 'none';
                document.getElementById('verification-pending').style.display = 'block';
                document.querySelector('.auth-title').textContent = 'Check your email';
                document.querySelector('.auth-subtitle').textContent = '';
                document.getElementById('verification-email').textContent = email;

                // Poll for verification — auto-redirect once confirmed
                startVerificationPolling();
                return;
            }

            // Auto-confirmed — redirect straight to dashboard
            if (data.user) {
                window.location.href = './';
            }
        }

        // ── Forgot Password ──
        async function handleForgotPassword() {
            const email = document.getElementById('forgot-email').value.trim();
            const errorEl = document.getElementById('forgot-error');
            const successEl = document.getElementById('forgot-success');
            const btn = document.getElementById('forgot-btn');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!email) {
                errorEl.textContent = 'Please enter your email';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';

            const { error } = await sbClient.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://bookisports.com/dashboard/'
            });

            btn.disabled = false;
            btn.textContent = 'Send Reset Link';

            if (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            } else {
                successEl.textContent = 'Reset link sent! Check your email.';
                successEl.style.display = 'block';
            }
        }

        // ── Verification Polling ──
        let verificationInterval = null;
        const VERIFICATION_POLL_MS = 3000;
        const VERIFICATION_TIMEOUT_MS = 10 * 60 * 1000; // 10 minutes

        function startVerificationPolling() {
            stopVerificationPolling();
            let dotCount = 0;
            const startTime = Date.now();

            verificationInterval = setInterval(async () => {
                // Stop after 10 minutes
                if (Date.now() - startTime > VERIFICATION_TIMEOUT_MS) {
                    stopVerificationPolling();
                    const statusEl = document.getElementById('verification-status');
                    if (statusEl) {
                        statusEl.innerHTML = 'Verification timed out. <a href="#" onclick="showLogin(); stopVerificationPolling(); return false;" style="color:var(--accent);">Log in</a> if you already verified.';
                    }
                    return;
                }

                // Animate dots
                dotCount = (dotCount + 1) % 4;
                const dotsEl = document.getElementById('verification-dots');
                if (dotsEl) dotsEl.textContent = '.'.repeat(dotCount || 1);

                // Check if user is now confirmed via existing session
                const { data: { user } } = await sbClient.auth.getUser();
                if (user?.confirmed_at || user?.email_confirmed_at) {
                    stopVerificationPolling();
                    const statusEl = document.getElementById('verification-status');
                    if (statusEl) {
                        statusEl.textContent = 'Verified! Setting up your account...';
                        statusEl.style.color = 'var(--accent, #00F5D4)';
                    }
                    setTimeout(() => { window.location.href = './'; }, 600);
                }
            }, VERIFICATION_POLL_MS);
        }

        function stopVerificationPolling() {
            if (verificationInterval) {
                clearInterval(verificationInterval);
                verificationInterval = null;
            }
        }

        // Enter on password field submits
        document.getElementById('login-password')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('signup-password-confirm')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSignUp();
        });
    </script>
</body>
</html>
