<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="../assets/favicon_io/favicon.ico">
    <title>Booki Dashboard — Log In</title>
    <meta name="description" content="Log in to your Booki dashboard to manage your book or track your picks.">

    <meta property="og:title" content="Booki Dashboard — Log In">
    <meta property="og:description" content="Manage your book or track your picks from the web.">
    <meta property="og:image" content="https://bookisports.com/assets/booki-og.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="../index.html" class="auth-logo">
                <img src="../assets/logo-booki-blk.svg" alt="Booki" />
            </a>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Log in to your dashboard</p>

            <!-- Login Form -->
            <div id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password">
                </div>
                <div id="login-error" class="form-error" style="display:none;"></div>
                <button id="login-btn" class="btn-primary-full" onclick="handleLogin()">Log In</button>
                <div class="auth-links">
                    <a href="#" onclick="showForgotPassword(); return false;">Forgot Password?</a>
                    <span class="auth-divider">|</span>
                    <a href="#" onclick="showSignUp(); return false;">Create Account</a>
                </div>
            </div>

            <!-- Sign Up Form -->
            <div id="signup-form" style="display:none;">
                <div class="form-group">
                    <label for="signup-name">Name</label>
                    <input type="text" id="signup-name" placeholder="Your name" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Min 6 characters" autocomplete="new-password">
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="signup-age">
                    <span>I confirm I am 18 years or older</span>
                </label>
                <div id="signup-error" class="form-error" style="display:none;"></div>
                <button id="signup-btn" class="btn-primary-full" onclick="handleSignUp()">Create Account</button>
                <div class="auth-links">
                    <a href="#" onclick="showLogin(); return false;">Back to Log In</a>
                </div>
            </div>

            <!-- Forgot Password Form -->
            <div id="forgot-form" style="display:none;">
                <div class="form-group">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" placeholder="you@example.com" autocomplete="email">
                </div>
                <div id="forgot-error" class="form-error" style="display:none;"></div>
                <div id="forgot-success" class="form-success" style="display:none;"></div>
                <button id="forgot-btn" class="btn-primary-full" onclick="handleForgotPassword()">Send Reset Link</button>
                <div class="auth-links">
                    <a href="#" onclick="showLogin(); return false;">Back to Log In</a>
                </div>
            </div>

            <p class="auth-disclaimer">Pick tracking platform. Not a sportsbook. No payment processing.</p>
        </div>
    </div>

    <script>
        // ── Supabase Init ──
        const SUPABASE_URL = 'https://vstfauqufwpdytmvjyfz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzdGZhdXF1ZndwZHl0bXZqeWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMjcwNjcsImV4cCI6MjA4NDgwMzA2N30.uwimFkR3pN8BODjjM5KnusptdZz_vcrxKnK_2LKfZHI';
        let sbClient;

        // Initialize — key must be set in localStorage or env
        function initSupabase() {
            if (!SUPABASE_ANON_KEY) {
                document.getElementById('login-error').textContent = 'Dashboard not configured. Contact support.';
                document.getElementById('login-error').style.display = 'block';
                return false;
            }
            sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            return true;
        }

        // Check if already logged in — redirect to app for any authenticated user
        async function checkSession() {
            if (!initSupabase()) return;
            const { data: { session } } = await sbClient.auth.getSession();
            if (session) {
                window.location.href = './';
            }
        }

        // Check bookie record exists AND user isn't just a player with a spurious record
        async function isOrganizer(userId) {
            const { data: bookieRecord } = await sbClient
                .from('bookies')
                .select('id')
                .eq('auth_user_id', userId)
                .limit(1);

            if (!bookieRecord || bookieRecord.length === 0) return false;

            // Guard against spurious bookie records: if user is a player
            // under a DIFFERENT bookie, they're not a real organizer
            const { data: playerRecord } = await sbClient
                .from('players')
                .select('id, bookie_id')
                .eq('auth_user_id', userId)
                .limit(1);

            if (playerRecord && playerRecord.length > 0) {
                // Player exists — only allow if their bookie_id matches their own bookie record
                if (playerRecord[0].bookie_id !== bookieRecord[0].id) {
                    return false;
                }
            }

            return true;
        }

        checkSession();

        // ── Form Toggles ──
        function showLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('forgot-form').style.display = 'none';
            document.querySelector('.auth-title').textContent = 'Welcome back';
            document.querySelector('.auth-subtitle').textContent = 'Log in to your dashboard';
        }

        function showSignUp() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
            document.getElementById('forgot-form').style.display = 'none';
            document.querySelector('.auth-title').textContent = 'Create account';
            document.querySelector('.auth-subtitle').textContent = 'Start managing your group';
        }

        function showForgotPassword() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('forgot-form').style.display = 'block';
            document.querySelector('.auth-title').textContent = 'Reset password';
            document.querySelector('.auth-subtitle').textContent = 'Enter your email to receive a reset link';
        }

        // ── Login ──
        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            errorEl.style.display = 'none';
            if (!email || !password) {
                errorEl.textContent = 'Please enter email and password';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            const { data, error } = await sbClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Log In';
                return;
            }

            // Redirect to app — role detection happens in app.html
            window.location.href = './';
        }

        // ── Sign Up ──
        async function handleSignUp() {
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const ageConfirmed = document.getElementById('signup-age').checked;
            const errorEl = document.getElementById('signup-error');
            const btn = document.getElementById('signup-btn');

            errorEl.style.display = 'none';

            if (!name || !email || !password) {
                errorEl.textContent = 'All fields are required';
                errorEl.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters';
                errorEl.style.display = 'block';
                return;
            }
            if (!ageConfirmed) {
                errorEl.textContent = 'You must confirm you are 18 or older';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const { data, error } = await sbClient.auth.signUp({
                email,
                password,
                options: { data: { name } }
            });

            if (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Account';
                return;
            }

            if (data.user && !data.user.confirmed_at) {
                errorEl.textContent = 'Check your email to verify your account, then log in.';
                errorEl.style.display = 'block';
                errorEl.style.color = 'var(--accent)';
                btn.disabled = false;
                btn.textContent = 'Create Account';
                return;
            }

            // Auto-confirmed — create bookie and redirect
            if (data.user) {
                await ensureBookieRecord(data.user, name);
                window.location.href = './';
            }
        }

        // ── Forgot Password ──
        async function handleForgotPassword() {
            const email = document.getElementById('forgot-email').value.trim();
            const errorEl = document.getElementById('forgot-error');
            const successEl = document.getElementById('forgot-success');
            const btn = document.getElementById('forgot-btn');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!email) {
                errorEl.textContent = 'Please enter your email';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';

            const { error } = await sbClient.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://bookisports.com/dashboard/'
            });

            btn.disabled = false;
            btn.textContent = 'Send Reset Link';

            if (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            } else {
                successEl.textContent = 'Reset link sent! Check your email.';
                successEl.style.display = 'block';
            }
        }

        // ── Bookie Record ──
        async function ensureBookieRecord(user, name) {
            const { data: existing } = await sbClient
                .from('bookies')
                .select('id')
                .eq('auth_user_id', user.id)
                .limit(1);

            if (existing && existing.length > 0) return;

            const displayName = name || user.user_metadata?.name || user.email?.split('@')[0] || 'Organizer';

            await sbClient
                .from('bookies')
                .insert({
                    auth_user_id: user.id,
                    name: displayName,
                    email: user.email
                });
        }

        // Enter on password field submits
        document.getElementById('login-password')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('signup-password')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSignUp();
        });
    </script>
</body>
</html>
