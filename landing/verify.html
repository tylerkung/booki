<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Your Email - Booki</title>
  <meta property="og:title" content="Verifying Your Email - Booki">
  <meta property="og:image" content="https://bookisports.com/assets/bookie-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bookisports.com/assets/bookie-og.jpg">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0A12;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #F8F8F8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 400px;
    }
    .logo {
      width: 140px;
      margin-bottom: 32px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2A2A3A;
      border-top-color: #00F5D4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    p {
      font-size: 15px;
      color: #A8A8B8;
      line-height: 1.5;
      margin: 0;
    }
    .success { display: none; }
    .error { display: none; }
    .error p { color: #FF6B6B; }
    .checkmark {
      font-size: 48px;
      color: #00F5D4;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 32px;
      background-color: #00F5D4;
      color: #0A0A12;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/logo-booki-wh.png" alt="Booki" class="logo" />

    <!-- Loading state -->
    <div id="loading">
      <div class="spinner"></div>
      <h1>Verifying your email...</h1>
      <p>Hang tight, this will only take a moment.</p>
    </div>

    <!-- Success state -->
    <div id="success" class="success">
      <div class="checkmark">&#10003;</div>
      <h1>Email Verified</h1>
      <p>Your account is confirmed. You can now log in to Booki.</p>
      <a href="booki://login" class="btn">Open Booki</a>
    </div>

    <!-- Error state -->
    <div id="error" class="error">
      <h1>Verification Failed</h1>
      <p>This link may have expired or already been used. Try logging in or request a new verification email.</p>
    </div>
  </div>

  <script>
    // Supabase sends: /verify#access_token=...&type=signup
    // Or with PKCE: /verify?token=...&type=signup
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.substring(1));

      const token = params.get('token');
      const type = params.get('type') || hash.get('type');
      const accessToken = hash.get('access_token');

      // If we have hash-based tokens (implicit flow), verification is already done
      if (accessToken && type === 'signup') {
        showSuccess();
        return;
      }

      // If we have a PKCE token, verify it via Supabase
      if (token && type === 'signup') {
        try {
          const res = await fetch(
            'https://vstfauqufwpdytmvjyfz.supabase.co/auth/v1/verify?' +
            new URLSearchParams({ token, type, redirect_to: window.location.origin + '/verify' }),
            { method: 'GET', redirect: 'manual' }
          );
          // Supabase returns a redirect on success
          if (res.status === 0 || res.status === 303 || res.status === 302 || res.ok) {
            showSuccess();
          } else {
            showError();
          }
        } catch (e) {
          // Network error or CORS redirect — likely means success
          showSuccess();
        }
        return;
      }

      // No token found
      showError();
    })();

    function showSuccess() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
