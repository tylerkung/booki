<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Your Email - Booki</title>
  <meta property="og:title" content="Verifying Your Email - Booki">
  <meta property="og:image" content="https://bookisports.com/assets/booki-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bookisports.com/assets/booki-og.jpg">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0A12;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #F8F8F8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 400px;
    }
    .logo {
      width: 140px;
      margin-bottom: 32px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2A2A3A;
      border-top-color: #00F5D4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    p {
      font-size: 15px;
      color: #A8A8B8;
      line-height: 1.5;
      margin: 0;
    }
    .success { display: none; }
    .error { display: none; }
    .error p { color: #FF6B6B; }
    .checkmark {
      font-size: 48px;
      color: #00F5D4;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 32px;
      background-color: #00F5D4;
      color: #0A0A12;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/logo-booki-wh.png" alt="Booki" class="logo" />

    <!-- Loading state -->
    <div id="loading">
      <div class="spinner"></div>
      <h1>Verifying your email...</h1>
      <p>Hang tight, this will only take a moment.</p>
    </div>

    <!-- Success state -->
    <div id="success" class="success">
      <div class="checkmark">&#10003;</div>
      <h1>Email Verified</h1>
      <p id="success-copy">Your account is confirmed. Redirecting you now...</p>
      <a id="continue-link" href="/dashboard/" class="btn">Continue</a>
    </div>

    <!-- Error state -->
    <div id="error" class="error">
      <h1>Verification Failed</h1>
      <p>This link may have expired or already been used. Try logging in or request a new verification email.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/invite-handoff.js"></script>
  <script>
    // The confirm email links here with ?token={{ .TokenHash }}&type=signup
    // (see landing/email-confirm.html). Implicit grants arrive as a hash.
    // Either way the session has to be stored before we leave, or the
    // dashboard treats the person as logged out and they have to sign in
    // by hand — which is what used to drop invitees back on the join form.
    var SUPABASE_URL = 'https://vstfauqufwpdytmvjyfz.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzdGZhdXF1ZndwZHl0bXZqeWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMjcwNjcsImV4cCI6MjA4NDgwMzA2N30.uwimFkR3pN8BODjjM5KnusptdZz_vcrxKnK_2LKfZHI';

    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: false, persistSession: true }
    });

    function pendingCode(session) {
      var code = window.BookiInvite ? window.BookiInvite.readCode() : '';
      var meta = session && session.user && session.user.user_metadata
        ? session.user.user_metadata.pending_invite
        : '';
      if (!code && meta && window.BookiInvite) code = window.BookiInvite.normalize(meta);
      if (code && window.BookiInvite) window.BookiInvite.writeCode(code, window.BookiInvite.readName());
      return code;
    }

    function destination(session) {
      var code = pendingCode(session);
      if (window.BookiInvite && window.BookiInvite.dashboardTarget) {
        return window.BookiInvite.dashboardTarget(code);
      }
      return code ? ('/dashboard/?invite=' + encodeURIComponent(code)) : '/dashboard/';
    }

    (async function () {
      var params = new URLSearchParams(window.location.search);
      var hash = new URLSearchParams(window.location.hash.substring(1));
      var token = params.get('token') || params.get('token_hash');
      var type = params.get('type') || hash.get('type') || '';
      var accessToken = hash.get('access_token');
      var refreshToken = hash.get('refresh_token');
      var pkceCode = params.get('code');

      try {
        if (token && (type === 'signup' || type === 'email' || type === '')) {
          var verified = await sb.auth.verifyOtp({
            token_hash: token,
            type: type === 'email' ? 'email' : 'signup'
          });
          if (verified.error || !verified.data || !verified.data.session) {
            showError();
            return;
          }
          showSuccess(verified.data.session);
          return;
        }

        if (accessToken && refreshToken && type !== 'recovery') {
          var restored = await sb.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (restored.error || !restored.data || !restored.data.session) {
            showError();
            return;
          }
          showSuccess(restored.data.session);
          return;
        }

        if (pkceCode) {
          var exchanged = await sb.auth.exchangeCodeForSession(pkceCode);
          if (exchanged.error || !exchanged.data || !exchanged.data.session) {
            showError();
            return;
          }
          showSuccess(exchanged.data.session);
          return;
        }
      } catch (e) {
        showError();
        return;
      }

      showError();
    })();

    function showSuccess(session) {
      var next = destination(session);
      if (window.BookiInvite) window.BookiInvite.clearAwaiting();
      var copy = document.getElementById('success-copy');
      var link = document.getElementById('continue-link');
      var code = pendingCode(session);
      if (code && copy) copy.textContent = 'Your account is confirmed. Taking you into the group...';
      if (link) link.href = next;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('success').style.display = 'block';
      setTimeout(function () { window.location.href = next; }, 800);
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }
  </script>
    <script src="attribution.js"></script>
</body>
</html>
