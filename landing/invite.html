<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="assets/favicon_io/favicon.ico">
    <meta name="description" content="You've been invited to join a group on Booki. Sign up and enter your invite code to get started.">
    <title>Join Invite — Booki</title>
    <link rel="canonical" href="https://bookisports.com/invite.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bookisports.com/invite.html">
    <meta property="og:title" content="Join Invite — Booki">
    <meta property="og:description" content="You've been invited to join a group on Booki. Sign up and enter your invite code to get started.">
    <meta property="og:image" content="https://bookisports.com/assets/booki-og.jpg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Join Invite — Booki">
    <meta name="twitter:description" content="You've been invited to join a group on Booki. Sign up and enter your invite code to get started.">
    <meta name="twitter:image" content="https://bookisports.com/assets/booki-og.jpg">

    <link rel="stylesheet" href="styles.css">
    <style>
        .invite-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .invite-card {
            max-width: 400px;
            width: 100%;
        }
        .invite-logo {
            height: 64px;
            margin-bottom: 32px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .invite-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .invite-sub {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .invite-code {
            display: inline-block;
            font-family: 'Space Grotesk', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--accent);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 24px;
            margin-bottom: 32px;
        }
        .invite-btn {
            display: inline-block;
            padding: 14px 32px;
            background: var(--accent);
            color: var(--bg);
            font-weight: 700;
            font-size: 1rem;
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 16px;
        }
        .invite-fallback {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="invite-page">
        <div class="invite-card">
            <img src="/assets/logo-booki-blk.svg" alt="Booki" class="invite-logo">
            <h1 class="invite-title">You've been invited</h1>
            <p class="invite-sub">Sign in to Booki to join your group.</p>
            <div class="invite-code" id="inviteCode"></div>
            <br><br>
            <a href="/dashboard/" id="openAppBtn" class="invite-btn">Open Booki</a>
            <p class="invite-fallback">Copy the code above and enter it after signing up.</p>
        </div>
    </div>
    <script>
        // Extract invite code from URL path: /invite/ABC123
        var pathParts = window.location.pathname.split('/');
        var code = pathParts[pathParts.length - 1] || '';

        // Display the code
        document.getElementById('inviteCode').textContent = code;

        // Set button to web dashboard
        document.getElementById('openAppBtn').href = '/dashboard/';

        // On iOS, try deep link first (falls back to web if app not installed)
        if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
            var deepLink = 'booki://invite/' + code;
            window.location.href = deepLink;
        }
    </script>
</body>
</html>
