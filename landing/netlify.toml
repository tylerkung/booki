[build]
  publish = "."
  # Skip the build when the push changed nothing this site serves.
  #
  # Auto-deploy fires on every push to main, and a large share of this repo's
  # commits are migrations, edge functions, PRDs and CLAUDE.md — none of which
  # Netlify publishes. Those still ran a full build and republished a
  # byte-identical site. One measured example: a837acc changed only CLAUDE.md
  # and supabase/migrations/055, and produced a production deploy.
  #
  # Netlify runs this from the base directory, which is landing/, so `-- .`
  # scopes the diff to exactly what gets published. Exit 0 cancels the build;
  # non-zero proceeds. On the first run after this lands CACHED_COMMIT_REF may
  # be unset, which makes git error, which is non-zero — so the failure mode is
  # "build anyway", not "silently skip".
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[redirects]]
  from = "/invite/*"
  to = "/invite.html"
  status = 200

# Old blog URLs for the comparison pages. The canonical pages live under /vs/.
[[redirects]]
  from = "/blog/booki-vs-perhead-cr"
  to = "/vs/perhead-cr"
  status = 301

[[redirects]]
  from = "/blog/booki-vs-realbookies"
  to = "/vs/realbookies"
  status = 301

[[redirects]]
  from = "/blog/booki-vs-price-per-player"
  to = "/vs/price-per-player"
  status = 301

[[redirects]]
  from = "/blog/booki-vs-ace-per-head"
  to = "/vs/ace-per-head"
  status = 301

[[redirects]]
  from = "/blog/booki-vs-payperhead"
  to = "/vs/payperhead"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache"
