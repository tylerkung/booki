<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booki Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========================================
   RESET & BASE
   ======================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'IBM Plex Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ========================================
   CSS CUSTOM PROPERTIES (Design Tokens)
   ======================================== */
:root {
  /* Backgrounds */
  --bg: #0A0A12;
  --card-bg: #14141F;
  --elevated-bg: #1E1E2D;

  /* Accents */
  --accent: #00F5D4;
  --accent-secondary: #9D4EDD;
  --accent-tertiary: #FF006E;
  --gold: #FFE66D;

  /* Semantic */
  --danger: #FF6B6B;
  --warning: #FFA94D;

  /* Text */
  --text-primary: #F8F8F8;
  --text-secondary: #A8A8B8;
  --text-muted: #6B6B7B;

  /* UI */
  --border: #2A2A3A;
  --divider: #22222E;

  /* Typography */
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'IBM Plex Sans', sans-serif;

  /* Spacing */
  --xs: 4px;
  --sm: 8px;
  --md: 12px;
  --lg: 16px;
  --xl: 24px;
  --xxl: 32px;
}

/* ========================================
   PHONE FRAME
   ======================================== */
.phone-frame {
  width: 393px;
  height: 852px;
  background: var(--bg);
  border-radius: 54px;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 0 2px #333,
    0 0 0 6px #1a1a1a,
    0 0 0 8px #333,
    0 50px 100px rgba(0,0,0,0.5);
}

.phone-screen {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Status bar */
.status-bar {
  height: 54px;
  padding: 14px 32px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  background: var(--card-bg);
}
.status-bar .time {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  color: var(--text-primary);
}
.status-bar .icons {
  display: flex;
  gap: 5px;
  align-items: center;
}
.status-bar .icons svg { fill: var(--text-primary); }

/* Dynamic island */
.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 36px;
  background: #000;
  border-radius: 20px;
  z-index: 100;
}

/* Home indicator */
.home-indicator {
  height: 34px;
  display: flex;
  align-items: end;
  justify-content: center;
  padding-bottom: 8px;
  flex-shrink: 0;
  background: var(--bg);
}
.home-indicator-bar {
  width: 134px;
  height: 5px;
  background: var(--text-secondary);
  border-radius: 3px;
  opacity: 0.4;
}

/* ========================================
   APP HEADER
   ======================================== */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px var(--lg) var(--md);
  background: var(--card-bg);
  border-bottom: 0.5px solid var(--divider);
  flex-shrink: 0;
}
.app-header .logo {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}
.app-header .title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 17px;
  color: var(--text-primary);
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.app-header .balance {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  color: var(--accent);
}

/* ========================================
   SPORT TABS
   ======================================== */
.sport-tabs {
  display: flex;
  gap: var(--md);
  padding: var(--md) var(--lg);
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg);
  border-bottom: 0.5px solid var(--divider);
  flex-shrink: 0;
}
.sport-tabs::-webkit-scrollbar { display: none; }

.sport-tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: var(--sm) var(--lg);
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  border: none;
  outline: none;
  flex-shrink: 0;
}
.sport-tab.active {
  background: var(--accent);
  color: var(--bg);
  font-weight: 600;
}
.sport-tab:not(.active) {
  background: var(--card-bg);
  color: var(--text-primary);
}
.sport-tab svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}
.sport-tab.active svg { fill: var(--bg); }
.sport-tab:not(.active) svg { fill: var(--text-primary); }

/* ========================================
   GAMES LIST
   ======================================== */
.games-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  background: var(--bg);
}
.games-list::-webkit-scrollbar { display: none; }

/* Section header (sticky) */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sm) var(--md);
  background: var(--bg);
  border-bottom: 0.5px solid var(--divider);
  position: sticky;
  top: 0;
  z-index: 10;
}
.section-header .sport-league {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}
.section-header .sport-league .dot {
  color: var(--text-muted);
}
.section-header .sport-league .league {
  color: var(--text-muted);
}
.section-header .market-labels {
  display: flex;
  gap: 4px;
}
.section-header .market-label {
  width: 62px;
  text-align: center;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

/* Game row */
.game-row {
  padding: var(--sm) var(--md);
  border-bottom: 0.5px solid var(--divider);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.game-row:nth-child(odd) {
  background: var(--card-bg);
}
.game-row:nth-child(even) {
  background: rgba(20, 20, 31, 0.6);
}

.game-time-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 4px;
}
.game-time {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-secondary);
}
.live-badge {
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  padding: 2px 6px;
  background: rgba(0, 245, 212, 0.15);
  border-radius: 999px;
}
.more-markets {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px 8px;
  background: var(--elevated-bg);
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--text-muted);
}
.more-markets svg {
  width: 9px;
  height: 9px;
  fill: var(--text-muted);
}

/* Team row */
.team-row {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 44px;
}
.team-badge {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--elevated-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 700;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.team-name {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Odds buttons */
.odds-grid {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}

.odds-btn {
  width: 62px;
  height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  background: var(--elevated-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  padding: 0;
  outline: none;
  position: relative;
  overflow: hidden;
}
.odds-btn:active {
  transform: scale(0.95);
}
.odds-btn.selected {
  background: var(--accent);
  border-color: var(--accent);
}
.odds-btn .line {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
}
.odds-btn .odds {
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 500;
  color: var(--text-muted);
  line-height: 1.2;
}
.odds-btn.moneyline .odds {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}
.odds-btn.selected .line {
  color: var(--bg);
}
.odds-btn.selected .odds {
  color: rgba(10, 10, 18, 0.7);
}
.odds-btn.moneyline.selected .odds {
  color: var(--bg);
}

.odds-btn-empty {
  width: 62px;
  height: 44px;
}

/* ========================================
   FLOATING BET SLIP BAR
   ======================================== */
.floating-bar {
  position: absolute;
  bottom: 100px;
  left: var(--lg);
  right: var(--lg);
  display: flex;
  align-items: center;
  padding: var(--md) var(--lg);
  background: var(--accent);
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 245, 212, 0.3);
  z-index: 20;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.floating-bar.visible {
  transform: translateY(0);
  opacity: 1;
}
.floating-bar:active {
  transform: scale(0.97);
}
.floating-bar svg {
  width: 18px;
  height: 18px;
  fill: var(--bg);
  margin-right: var(--sm);
}
.floating-bar .bar-text {
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  color: var(--bg);
  flex: 1;
}
.floating-bar .chevron {
  fill: rgba(10, 10, 18, 0.7);
}

/* ========================================
   TAB BAR
   ======================================== */
.tab-bar {
  display: flex;
  padding: 6px 0 0;
  background: var(--bg);
  border-top: 0.5px solid var(--divider);
  flex-shrink: 0;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 0;
  cursor: pointer;
  border: none;
  background: none;
  outline: none;
}
.tab-item svg {
  width: 22px;
  height: 22px;
}
.tab-item.active svg { fill: var(--accent); }
.tab-item:not(.active) svg { fill: var(--text-secondary); }
.tab-item .tab-label {
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tab-item.active .tab-label { color: var(--accent); }
.tab-item:not(.active) .tab-label { color: var(--text-secondary); }

/* ========================================
   BET SLIP SHEET (Overlay)
   ======================================== */
.sheet-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.sheet-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.bet-slip-sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 88%;
  background: var(--bg);
  border-radius: 16px 16px 0 0;
  z-index: 51;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
}
.bet-slip-sheet.visible {
  transform: translateY(0);
}

/* Sheet handle */
.sheet-handle-area {
  padding: 8px 0 4px;
  display: flex;
  justify-content: center;
  flex-shrink: 0;
}
.sheet-handle {
  width: 36px;
  height: 5px;
  background: var(--text-muted);
  border-radius: 3px;
  opacity: 0.4;
}

/* Sheet header */
.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px var(--lg) var(--md);
  flex-shrink: 0;
}
.sheet-header .close-btn {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
}
.sheet-header .sheet-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  color: var(--text-primary);
}
.sheet-header .clear-btn {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--danger);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
}

/* Accent top border */
.accent-border {
  height: 3px;
  background: var(--accent);
  flex-shrink: 0;
}

/* Mode toggle */
.mode-toggle {
  display: flex;
  margin: var(--md) var(--lg) 0;
  background: var(--elevated-bg);
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
}
.mode-btn {
  flex: 1;
  padding: 10px;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
  border: none;
  background: none;
  transition: all 0.2s ease;
  outline: none;
  color: var(--text-secondary);
}
.mode-btn.active {
  background: var(--accent);
  color: var(--bg);
  font-weight: 600;
}

/* Selection count */
.selection-count {
  padding: var(--sm) var(--lg) 0;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.selection-count .max {
  color: var(--text-muted);
}

/* Sheet scrollable */
.sheet-scroll {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: none;
  padding: var(--md) var(--lg);
}
.sheet-scroll::-webkit-scrollbar { display: none; }

/* Selection card */
.selection-card {
  background: var(--card-bg);
  border-radius: 12px;
  border: 0.5px solid var(--border);
  margin-bottom: var(--md);
  overflow: hidden;
}
.selection-card.animate-in {
  animation: cardIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.selection-card-header {
  display: flex;
  align-items: flex-start;
  gap: var(--sm);
  padding: var(--md) var(--md) var(--sm);
}
.selection-team {
  flex: 1;
}
.selection-team .pick-name {
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.selection-team .context {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.selection-odds {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
}
.remove-btn {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  outline: none;
  flex-shrink: 0;
}
.remove-btn svg {
  width: 18px;
  height: 18px;
  fill: var(--text-muted);
}

/* Stake fields (singles) */
.stake-fields {
  display: flex;
  gap: var(--md);
  padding: var(--sm) var(--md) var(--md);
  border-top: 1px solid var(--divider);
}
.stake-field {
  flex: 1;
  padding: var(--md) var(--md) var(--sm);
  background: var(--elevated-bg);
  border-radius: 8px;
  border: 0.5px solid var(--border);
  cursor: pointer;
  transition: all 0.2s ease;
}
.stake-field.active {
  border: 2px solid var(--gold);
  box-shadow: 0 0 8px rgba(255, 230, 109, 0.5);
}
.stake-field.active.towin {
  border-color: var(--accent);
  box-shadow: 0 0 8px rgba(0, 245, 212, 0.5);
}
.stake-field .field-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.stake-field.active .field-label {
  color: var(--gold);
}
.stake-field.active.towin .field-label {
  color: var(--accent);
}
.stake-field .field-value {
  display: flex;
  align-items: baseline;
  gap: 2px;
}
.stake-field .dollar {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
}
.stake-field .amount {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-muted);
  min-width: 20px;
}
.stake-field.has-value .dollar,
.stake-field.has-value .amount {
  color: var(--gold);
}
.stake-field.has-value.towin .dollar,
.stake-field.has-value.towin .amount {
  color: var(--accent);
}

/* Summary section */
.summary-section {
  margin-top: var(--sm);
}
.summary-label {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: var(--sm);
}
.summary-card {
  background: var(--card-bg);
  border-radius: 12px;
  border: 0.5px solid var(--border);
  overflow: hidden;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--md) var(--lg);
}
.summary-row:not(:last-child) {
  border-bottom: 1px solid var(--divider);
}
.summary-row .label {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text-secondary);
}
.summary-row .value {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
}
.summary-row.total {
  padding: var(--lg);
  background: linear-gradient(to left, rgba(0, 245, 212, 0.1), transparent);
}
.summary-row.total .label {
  font-family: var(--font-body);
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
}
.summary-row.total .value {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
}

/* ========================================
   STICKY BOTTOM (Keypad + Submit)
   ======================================== */
.sheet-bottom {
  flex-shrink: 0;
  background: var(--card-bg);
  border-top: 1px solid var(--divider);
  box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
}
.sheet-bottom-inner {
  padding: var(--lg);
}

/* Numeric keypad */
.keypad-area {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.keypad-area.visible {
  max-height: 300px;
}

.quick-stakes {
  display: flex;
  gap: var(--sm);
  margin-top: var(--md);
  margin-bottom: var(--sm);
  align-items: center;
}
.quick-stake-btn {
  padding: 6px 0;
  flex: 1;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  background: var(--elevated-bg);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  text-align: center;
  outline: none;
}
.quick-stake-btn:active {
  background: var(--border);
}
.done-btn {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  text-transform: uppercase;
  padding: 6px 4px;
  outline: none;
}

.keypad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 6px 0;
}
.key-btn {
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--elevated-bg);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  outline: none;
  transition: transform 0.1s ease;
  -webkit-tap-highlight-color: transparent;
}
.key-btn:active {
  transform: scale(0.95);
  background: var(--border);
}
.key-btn svg {
  width: 20px;
  height: 20px;
  fill: var(--text-primary);
}

/* Submit button */
.submit-btn {
  width: 100%;
  padding: var(--lg);
  border: none;
  border-radius: 12px;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--bg);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  background: linear-gradient(to bottom, var(--accent), rgba(0, 245, 212, 0.85));
  box-shadow: 0 4px 12px rgba(0, 245, 212, 0.4);
  transition: all 0.2s ease;
  outline: none;
  margin-top: var(--md);
}
.submit-btn:active {
  transform: scale(0.97);
}
.submit-btn.disabled {
  opacity: 0.4;
  cursor: default;
}
.submit-btn.disabled:active {
  transform: none;
}
.compliance-text {
  text-align: center;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--text-muted);
  margin-top: var(--sm);
}

/* ========================================
   SUCCESS STATE
   ======================================== */
.success-overlay {
  position: absolute;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.success-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.success-check-container {
  position: relative;
  width: 140px;
  height: 140px;
  margin-bottom: var(--xl);
}
.success-glow-outer {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: rgba(0, 245, 212, 0.1);
  animation: pulseGlow 2s ease-in-out infinite;
}
.success-glow-inner {
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  background: rgba(0, 245, 212, 0.2);
}
.success-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid var(--accent);
  opacity: 0;
  animation: ringExpand 0.6s 0.2s ease-out forwards;
}
.success-icon {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: scale(0);
  animation: checkPop 0.4s 0.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
.success-icon svg {
  width: 70px;
  height: 70px;
  fill: var(--accent);
}

@keyframes checkPop {
  0% { transform: scale(0); }
  70% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
@keyframes ringExpand {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.4); opacity: 0; }
}
@keyframes pulseGlow {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 1; }
}

.success-message {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: var(--sm);
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.4s 0.4s ease forwards;
}
.success-subtext {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: var(--xxl);
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.4s 0.5s ease forwards;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.done-action-btn {
  width: calc(100% - 64px);
  padding: var(--lg);
  border: none;
  border-radius: 12px;
  font-family: var(--font-display);
  font-size: 17px;

  cursor: pointer;
  outline: none;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.4s 0.6s ease forwards;
}
.done-action-btn:active {
  transform: scale(0.97) translateY(0);
}

/* ========================================

function renderGames() {
  const list = document.getElementById('gamesList');
  const filtered = activeSport === 'all' ? GAMES : GAMES.filter(g => g.sportKey === activeSport);

  // Group by sport+league
  const groups = {};
  filtered.forEach((g, i) => {
    const origIdx = GAMES.indexOf(g);
    const key = `${g.sport}|${g.league}`;
    if (!groups[key]) groups[key] = { sport: g.sport, league: g.league, games: [] };
    groups[key].games.push({ ...g, origIdx });
  });

  let html = '';
  Object.values(groups).forEach(group => {
    html += `
      <div class="section-header">
        <div class="sport-league">
          <span>${group.sport}</span>
          <span class="dot">&middot;</span>
          <span class="league">${group.league}</span>
        </div>
        <div class="market-labels">
          <span class="market-label">Spread</span>
          <span class="market-label">Money</span>
          <span class="market-label">Total</span>
        </div>
      </div>`;

    group.games.forEach(game => {
      const gi = game.origIdx;
      html += `
        <div class="game-row">
          <div class="game-time-row">
            <span class="game-time">${game.time}</span>

          </div>
          ${renderTeamRow(gi, 'away', game)}
          ${renderTeamRow(gi, 'home', game)}

  });

  list.innerHTML = html;

function renderTeamRow(gi, side, game) {
  const team = game[side];
  const sp = game.spread[side];
  const ml = game.moneyline[side];
  const tt = side === 'away' ? game.total.over : game.total.under;

  const spreadId = `${gi}_spread_${side}`;
  const mlId = `${gi}_ml_${side}`;
  const totalId = `${gi}_total_${side}`;

  const spreadSel = selections.find(s => s.id === spreadId) ? 'selected' : '';
  const mlSel = selections.find(s => s.id === mlId) ? 'selected' : '';
  const totalSel = selections.find(s => s.id === totalId) ? 'selected' : '';

  return `
    <div class="team-row">
      <div class="team-badge">${team.abbr}</div>
      <div class="team-name">${team.name}</div>
      <div class="odds-grid">
        <button class="odds-btn ${spreadSel}" onclick="toggleSelection('${spreadId}', ${gi}, '${team.name}', 'Spread', '${sp.line}', '${sp.odds}')">
          <span class="line">${sp.line}</span>
          <span class="odds">${sp.odds}</span>
        </button>
        <button class="odds-btn moneyline ${mlSel}" onclick="toggleSelection('${mlId}', ${gi}, '${team.name}', 'Moneyline', '', '${ml.odds}')">
          <span class="odds">${ml.odds}</span>
        </button>
        <button class="odds-btn ${totalSel}" onclick="toggleSelection('${totalId}', ${gi}, '${team.name}', 'Total', '${tt.line}', '${tt.odds}')">
          <span class="line">${tt.line}</span>
          <span class="odds">${tt.odds}</span>
        </button>
      </div>
    </div>`;
}

// ========================================
// SELECTION MANAGEMENT
// ========================================
function toggleSelection(id, gameIdx, team, type, line, odds) {
  const existing = selections.findIndex(s => s.id === id);
  if (existing !== -1) {
    selections.splice(existing, 1);
  } else {
    const game = GAMES[gameIdx];
    const label = type === 'Moneyline' ? `${team}` :
                  type === 'Total' ? `${line.startsWith('o') ? 'Over' : 'Under'} ${line.substring(1)}` :
                  `${team} ${line}`;
    selections.push({
      id, gameIdx, team, type, line, odds, stake: '', toWin: '',
      label,
      context: `${game.league} · ${game.away.abbr} @ ${game.home.abbr} · ${game.time}`
    });
  }

  // Auto-switch from parlay to singles if < 2
  if (mode === 'parlay' && selections.length < 2) {
    setMode('singles');
  }

  updateUI();
}

function removeSelection(id) {
  selections = selections.filter(s => s.id !== id);
  if (activeField && !selections.find(s => s.id === activeField.selId)) {
    activeField = null;
  }
  if (mode === 'parlay' && selections.length < 2) {
    setMode('singles');
  }
  updateUI();
  if (selections.length === 0) closeBetSlip();
}

function clearAll() {
  selections = [];
  activeField = null;
  updateUI();
  closeBetSlip();
}

// ========================================
// ODDS CALCULATION
// ========================================
function americanToDecimal(odds) {
  const o = parseInt(odds);
  return o > 0 ? (o / 100) + 1 : (100 / Math.abs(o)) + 1;
}

function calcToWin(stake, odds) {
  if (!stake || isNaN(parseFloat(stake))) return '';
  const dec = americanToDecimal(odds);
  return (parseFloat(stake) * (dec - 1)).toFixed(2);
}

function calcStakeFromToWin(toWin, odds) {
  if (!toWin || isNaN(parseFloat(toWin))) return '';
  const dec = americanToDecimal(odds);
  return (parseFloat(toWin) / (dec - 1)).toFixed(2);
}

function parlayDecimalOdds() {
  let combined = 1;
  selections.forEach(s => { combined *= americanToDecimal(s.odds); });
  return combined;
}

function decimalToAmerican(dec) {
  if (dec >= 2) return `+${Math.round((dec - 1) * 100)}`;
  return `-${Math.round(100 / (dec - 1))}`;
}

// ========================================
// BET SLIP RENDERING
// ========================================
function renderBetSlip() {
  const scroll = document.getElementById('sheetScroll');
  let html = '';

  selections.forEach(sel => {
    const stakeActive = activeField && activeField.selId === sel.id && activeField.field === 'stake';
    const toWinActive = activeField && activeField.selId === sel.id && activeField.field === 'towin';
    const hasStake = sel.stake && sel.stake !== '';
    const hasToWin = sel.toWin && sel.toWin !== '';

    html += `
      <div class="selection-card${animateCards ? ' animate-in' : ''}">
        <div class="selection-card-header">
          <div class="selection-team">
            <div class="pick-name">${sel.label}</div>
            <div class="context">${sel.context}</div>
          </div>
          <span class="selection-odds">${sel.odds}</span>
          <button class="remove-btn" onclick="removeSelection('${sel.id}')">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
          </button>
        </div>
        ${mode === 'singles' ? `
        <div class="stake-fields">
          <div class="stake-field ${stakeActive ? 'active' : ''} ${hasStake ? 'has-value' : ''}" onclick="activateField('${sel.id}', 'stake')">
            <div class="field-label">Stake</div>
            <div class="field-value">
              <span class="dollar">$</span>
              <span class="amount">${sel.stake || '0'}</span>
            </div>
          </div>
          <div class="stake-field towin ${toWinActive ? 'active' : ''} ${hasToWin ? 'has-value' : ''}" onclick="activateField('${sel.id}', 'towin')">
            <div class="field-label">Potential</div>
            <div class="field-value">
              <span class="dollar">$</span>
              <span class="amount">${sel.toWin || '0'}</span>
            </div>
          </div>
        </div>` : ''}
      </div>`;
  });

  // Parlay odds card
  if (mode === 'parlay' && selections.length >= 2) {
    const decOdds = parlayDecimalOdds();
    const amOdds = decimalToAmerican(decOdds);
    html += `
      <div style="background: linear-gradient(135deg, rgba(0,245,212,0.15), var(--card-bg)); border-radius: 12px; border: 1px solid rgba(0,245,212,0.3); padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--text-primary);">${selections.length}-Leg Multi-Pick</div>
          <div style="font-family: var(--font-body); font-size: 12px; color: var(--text-secondary); margin-top: 2px;">Combined odds</div>
        </div>
        <div style="font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--accent);">${amOdds}</div>
      </div>`;

    // Parlay stake fields
    const parlayStake = selections[0]?.parlayStake || '';
    const parlayToWin = selections[0]?.parlayToWin || '';
    const psActive = activeField && activeField.selId === 'parlay' && activeField.field === 'stake';
    const ptActive = activeField && activeField.selId === 'parlay' && activeField.field === 'towin';
    const hasPStake = parlayStake !== '';
    const hasPToWin = parlayToWin !== '';

    html += `
      <div style="background: var(--card-bg); border-radius: 12px; border: 0.5px solid var(--border); padding: 12px; margin-bottom: 12px;">
        <div class="stake-fields" style="border-top: none; padding: 0;">
          <div class="stake-field ${psActive ? 'active' : ''} ${hasPStake ? 'has-value' : ''}" onclick="activateField('parlay', 'stake')" style="padding: 12px 12px 10px;">
            <div class="field-label">Stake</div>
            <div class="field-value">
              <span class="dollar" style="font-size: 18px;">$</span>
              <span class="amount" style="font-size: 22px;">${parlayStake || '0'}</span>
            </div>
          </div>
          <div class="stake-field towin ${ptActive ? 'active' : ''} ${hasPToWin ? 'has-value' : ''}" onclick="activateField('parlay', 'towin')" style="padding: 12px 12px 10px;">
            <div class="field-label">Potential</div>
            <div class="field-value">
              <span class="dollar" style="font-size: 18px;">$</span>
              <span class="amount" style="font-size: 22px;">${parlayToWin || '0'}</span>
            </div>
          </div>
        </div>
      </div>`;
  }

  // Summary
  if (mode === 'singles') {
    const totalStake = selections.reduce((sum, s) => sum + (parseFloat(s.stake) || 0), 0);
    const totalReturn = selections.reduce((sum, s) => sum + (parseFloat(s.stake) || 0) + (parseFloat(s.toWin) || 0), 0);
    if (totalStake > 0) {
      html += `
        <div class="summary-section">
          <div class="summary-label">Summary</div>
          <div class="summary-card">
            <div class="summary-row">
              <span class="label">Number of Picks</span>
              <span class="value">${selections.length}</span>
            </div>
            <div class="summary-row">
              <span class="label">Total Stake</span>
              <span class="value">$${totalStake.toFixed(2)}</span>
            </div>
            <div class="summary-row total">
              <span class="label">Total Return</span>
              <span class="value">$${totalReturn.toFixed(2)}</span>
            </div>
          </div>
        </div>`;
    }
  } else if (mode === 'parlay' && selections.length >= 2) {
    const parlayStake = parseFloat(selections[0]?.parlayStake) || 0;
    if (parlayStake > 0) {
      const decOdds = parlayDecimalOdds();
      const totalReturn = parlayStake * decOdds;
      html += `
        <div class="summary-section">
          <div class="summary-label">Summary</div>
          <div class="summary-card">
            <div class="summary-row">
              <span class="label">Total Stake</span>
              <span class="value">$${parlayStake.toFixed(2)}</span>
            </div>
            <div class="summary-row total">
              <span class="label">Total Return</span>
              <span class="value">$${totalReturn.toFixed(2)}</span>
            </div>
          </div>
        </div>`;
    }
  }

  scroll.innerHTML = html;
}

// ========================================
// FIELD ACTIVATION & KEYPAD
// ========================================
function activateField(selId, field) {
  activeField = { selId, field };
  document.getElementById('keypadArea').classList.add('visible');
  renderBetSlip();
  updateSubmitButton();
}

function closeKeypad() {
  activeField = null;
  document.getElementById('keypadArea').classList.remove('visible');
  renderBetSlip();
}

function keyPress(key) {
  if (!activeField) return;

  let sel, currentVal;
  if (activeField.selId === 'parlay') {
    sel = selections[0];
    if (!sel) return;
    currentVal = activeField.field === 'stake' ? (sel.parlayStake || '') : (sel.parlayToWin || '');
  } else {
    sel = selections.find(s => s.id === activeField.selId);
    if (!sel) return;
    currentVal = activeField.field === 'stake' ? sel.stake : sel.toWin;
  }

  if (key === 'del') {
    currentVal = currentVal.slice(0, -1);
  } else if (key === '.') {
    if (!currentVal.includes('.')) currentVal += currentVal === '' ? '0.' : '.';
  } else {
    // Enforce 2 decimal places
    const dotIdx = currentVal.indexOf('.');
    if (dotIdx !== -1 && currentVal.length - dotIdx > 2) return;
    currentVal += key;
  }

  // Set value and calculate bidirectional
  if (activeField.selId === 'parlay') {
    if (activeField.field === 'stake') {
      sel.parlayStake = currentVal;
      const dec = parlayDecimalOdds();
      sel.parlayToWin = currentVal && !isNaN(parseFloat(currentVal))
        ? (parseFloat(currentVal) * (dec - 1)).toFixed(2) : '';
    } else {
      sel.parlayToWin = currentVal;
      const dec = parlayDecimalOdds();
      sel.parlayStake = currentVal && !isNaN(parseFloat(currentVal))
        ? (parseFloat(currentVal) / (dec - 1)).toFixed(2) : '';
    }
    // Sync parlay values to all selections
    selections.forEach(s => {
      s.parlayStake = sel.parlayStake;
      s.parlayToWin = sel.parlayToWin;
    });
  } else {
    if (activeField.field === 'stake') {
      sel.stake = currentVal;
      sel.toWin = calcToWin(currentVal, sel.odds);
    } else {
      sel.toWin = currentVal;
      sel.stake = calcStakeFromToWin(currentVal, sel.odds);
    }
  }

  renderBetSlip();
  updateSubmitButton();
}

function addQuickStake(amount) {
  if (!activeField) return;

  let sel, currentVal;
  if (activeField.selId === 'parlay') {
    sel = selections[0];
    if (!sel) return;
    currentVal = activeField.field === 'stake' ? (sel.parlayStake || '0') : (sel.parlayToWin || '0');
  } else {
    sel = selections.find(s => s.id === activeField.selId);
    if (!sel) return;
    currentVal = activeField.field === 'stake' ? (sel.stake || '0') : (sel.toWin || '0');
  }

  const newVal = (parseFloat(currentVal) || 0) + amount;

  if (activeField.selId === 'parlay') {
    if (activeField.field === 'stake') {
      sel.parlayStake = newVal.toString();
      const dec = parlayDecimalOdds();
      sel.parlayToWin = (newVal * (dec - 1)).toFixed(2);
    } else {
      sel.parlayToWin = newVal.toString();
      const dec = parlayDecimalOdds();
      sel.parlayStake = (newVal / (dec - 1)).toFixed(2);
    }
    selections.forEach(s => { s.parlayStake = sel.parlayStake; s.parlayToWin = sel.parlayToWin; });
  } else {
    if (activeField.field === 'stake') {
      sel.stake = newVal.toString();
      sel.toWin = calcToWin(sel.stake, sel.odds);
    } else {
      sel.toWin = newVal.toString();
      sel.stake = calcStakeFromToWin(sel.toWin, sel.odds);
    }
  }

  renderBetSlip();
  updateSubmitButton();
}

// ========================================
// MODE SWITCHING
// ========================================
function setMode(m) {
  mode = m;
  document.getElementById('singlesBtn').classList.toggle('active', m === 'singles');
  document.getElementById('parlayBtn').classList.toggle('active', m === 'parlay');
  activeField = null;
  document.getElementById('keypadArea').classList.remove('visible');
  renderBetSlip();
  updateSubmitButton();
}

// ========================================
// BET SLIP OPEN/CLOSE
// ========================================
function openBetSlip() {
  animateCards = true;
  document.getElementById('sheetOverlay').classList.add('visible');
  document.getElementById('betSlipSheet').classList.add('visible');
  renderBetSlip();
  animateCards = false;
}

function closeBetSlip() {
  document.getElementById('sheetOverlay').classList.remove('visible');
  document.getElementById('betSlipSheet').classList.remove('visible');
  activeField = null;
  document.getElementById('keypadArea').classList.remove('visible');
}

// ========================================
// SUBMIT
// ========================================
function updateSubmitButton() {
  const btn = document.getElementById('submitBtn');
  let hasValidStake = false;

  if (mode === 'singles') {
    hasValidStake = selections.some(s => parseFloat(s.stake) > 0);
  } else {
    hasValidStake = selections.length >= 2 && parseFloat(selections[0]?.parlayStake) > 0;
  }

  btn.classList.toggle('disabled', !hasValidStake);
  btn.textContent = mode === 'parlay' && selections.length >= 2
    ? 'Record Multi-Pick'
    : selections.length > 1 ? `Record ${selections.length} Picks` : 'Record Pick';
}

function submitPicks() {
  const btn = document.getElementById('submitBtn');
  if (btn.classList.contains('disabled')) return;

  const count = selections.length;
  const msg = confirmMessages[Math.floor(Math.random() * confirmMessages.length)];

  // Show success
  document.getElementById('successMsg').textContent = msg;
  document.getElementById('successSub').textContent = `${count} pick${count > 1 ? 's' : ''} recorded.`;
  document.getElementById('successOverlay').classList.add('visible');
}

function resetFromSuccess() {
  document.getElementById('successOverlay').classList.remove('visible');
  selections = [];
  activeField = null;
  mode = 'singles';
  document.getElementById('singlesBtn').classList.add('active');
  document.getElementById('parlayBtn').classList.remove('active');
  closeBetSlip();
  updateUI();
}

// ========================================
// UI UPDATES
// ========================================
function updateUI() {
  renderGames();

  const bar = document.getElementById('floatingBar');
  const barText = document.getElementById('barText');
  const count = selections.length;

  if (count > 0) {
    bar.classList.add('visible');
    barText.textContent = `${count} Selection${count > 1 ? 's' : ''}`;
  } else {
    bar.classList.remove('visible');
  }

  document.getElementById('selectionCount').innerHTML =
    `${count} selection${count > 1 ? 's' : ''} &middot; <span class="max">$500.00 max</span>`;

  renderBetSlip();
  updateSubmitButton();
}

// ========================================
// SPORT TAB SWITCHING
// ========================================
document.querySelectorAll('.sport-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeSport = tab.dataset.sport;
    renderGames();
  });
});

// ========================================
// INIT
// ========================================
renderGames();
</script>
