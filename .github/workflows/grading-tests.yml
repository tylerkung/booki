name: Grading unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  grading-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prop and parlay grading
        run: node --experimental-strip-types --test supabase/functions/_shared/grading_rules.test.mts supabase/functions/_shared/submit_idempotency.test.mts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/submit_idempotency.test.mts
